# Shared version catalog for every project in the workspace.
# Imported by each consuming repo's settings.gradle via:
#   dependencyResolutionManagement {
#       versionCatalogs {
#           libs { from(files("../release-tools/gradle/libs.versions.toml")) }
#       }
#   }
#
# Policy: every dependency that CAN be routed through this catalog belongs here,
# full stop - "only one repo currently uses it" is never a reason to keep a
# literal. A dependency stays literal/local ONLY for one of these concrete
# reasons, each documented inline at its use site:
#   1. Genuine version divergence from what's declared here - use
#      `libs.x { version { strictly("...") } }`, NOT a disconnected literal
#      string, so the drift stays visible and searchable.
#   2. A confirmed Gradle compile failure prevents `libs.x`/`strictly()` from
#      being used at all - wrapped in `platform(...)`, or referenced from
#      inside a `Plugin<Project>` Kotlin source file.
#   3. A tightly-coupled multi-artifact version family unique to one repo,
#      where every member's version is pinned to the others (libGDX+KTX,
#      Kotlin+KSP compiler-plugin pairs, sgtpuzzles' buildSrc-resolved
#      AGP/Kotlin) - cataloguing one member without the rest would be
#      misleading, not simplifying.
# Re-check case 1 periodically with:
#   find . -name 'build.gradle*' -print0 | xargs -0 grep -E '\("[^"]*([0-9]+\.)+[0-9]+' | grep -v 'strictly("'
# A dependency kept literal only because it was single-repo can silently
# become a real multi-repo duplicate (this is how Room and
# kotlinx-coroutines-core ended up here on 2026-08-05 - both were
# "single-repo, stays literal" until a second repo picked them up at the same
# version and nobody noticed). See RELEASE_TRACKER_HISTORY.md's "Shared
# version catalog" sections for the full reconciliation history and
# RELEASE_TRACKER.md's "Shared catalog" column for per-repo/branch status.

