plugins {
    id 'groovy'
    id 'java-gradle-plugin'
}

// This workspace lives inside a Box Sync-synced folder, which intermittently
// locks files under build/ while syncing. Keep this project's own output local.
layout.buildDirectory.set(new File("E:/tmp/gradle-builds/release-tools"))

repositories {
    google()
    mavenCentral()
    gradlePluginPortal()
}

gradlePlugin {
    plugins {
        releaseTools {
            id = 'com.batodev.releasetools'
            implementationClass = 'com.batodev.releasetools.ReleaseToolsPlugin'
        }
    }
}

dependencies {
    implementation gradleApi()
    implementation localGroovy()
}
