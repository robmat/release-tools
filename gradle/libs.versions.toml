# Shared version catalog for every project in the workspace.
# Imported by each consuming repo's settings.gradle via:
#   dependencyResolutionManagement {
#       versionCatalogs {
#           libs { from(files("../release-tools/gradle/libs.versions.toml")) }
#       }
#   }
#
# Policy: every dependency whose version is actually consistent wherever it's
# used lives here, even if only one repo currently uses it. A dependency stays
# literal/local in a project ONLY when its version genuinely diverges from
# what's declared here (a real, different version - documented inline in that
# project's build file) - never just because it's currently single-repo. See
# RELEASE_TRACKER_HISTORY.md's "Shared version catalog" sections for the full
# reconciliation history and RELEASE_TRACKER.md's "Shared catalog" column for
# per-repo/branch status.

